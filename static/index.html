<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game of Life &middot; MCP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230b0e13'/><rect x='3' y='3' width='4' height='4' fill='%237ce38b'/><rect x='9' y='6' width='4' height='4' fill='%237ce38b'/><rect x='5' y='10' width='4' height='4' fill='%232e7d4f'/></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">LIFE<span>&middot;</span>MCP</div>
  <div class="stats">
    <span>gen <b id="stat-gen">0</b></span>
    <span>pop <b id="stat-pop">0</b></span>
    <span id="stat-size">&mdash;</span>
    <span id="stat-cursor"></span>
  </div>
  <div class="controls">
    <button id="btn-play">&#9654; Play</button>
    <button id="btn-step">Step</button>
    <label class="timeline">time
      <input id="timeline" type="range" min="0" max="0" value="0" step="1">
      <span id="timeline-label">0</span>
    </label>
    <button id="btn-rewind" title="rewind to selected generation">Rewind</button>
    <label class="speed">speed <input id="fps" type="range" min="1" max="1000" step="1" value="10"><span id="fps-label">10</span>/s</label>
    <span class="modes">
      <button id="mode-draw" class="active" title="left-drag paints live cells, right-drag erases">Draw</button>
      <button id="mode-erase" title="left-drag erases cells">Erase</button>
      <button id="mode-pan" title="left-drag pans; wheel always zooms">Pan</button>
    </span>
    <button id="btn-fit" title="fit board to window">Fit</button>
    <button id="btn-clear" class="danger" title="kill all cells">Clear</button>
    <span id="conn" class="conn" title="server connection">&#9679;</span>
  </div>
</header>
<main>
  <aside class="left-panel">
    <h2>Tools</h2>
    <div class="panel-body">
      <details class="tool-box">
        <summary>Create World</summary>
        <div class="tool-content">
          <label>width
            <input id="create-width" type="number" min="8" max="1024" step="1" value="160">
          </label>
          <label>height
            <input id="create-height" type="number" min="8" max="1024" step="1" value="100">
          </label>
          <label>edge
            <select id="create-edge">
              <option value="wrap" selected>wrap</option>
              <option value="dead">dead</option>
            </select>
          </label>
          <label>random fill
            <input id="create-random" type="range" min="0" max="1" step="0.01" value="0">
          </label>
          <button id="btn-create">Create</button>
          <div class="panel-note">Creates a new world and resets timeline history.</div>
        </div>
      </details>

      <details class="tool-box">
        <summary>Advance</summary>
        <div class="tool-content">
          <label>generations
            <input id="advance-generations" type="number" min="1" max="100" step="1" value="10">
          </label>
          <button id="btn-advance">Advance</button>
          <div class="panel-note">Advances 1-100 generations and commits changes.</div>
        </div>
      </details>
    </div>
  </aside>
  <div id="left-resizer" class="panel-resizer" title="drag to resize sidebar"></div>
  <canvas id="view"></canvas>
  <aside class="right-panel">
    <h2>Activity</h2>
    <div id="events"><div class="evt-empty">Waiting for agent activity&hellip;</div></div>
    <div class="hint">
      Agents connect via MCP (click to copy):
      <code id="mcp-cmd" title="click to copy">claude mcp add --transport http gol http://localhost:8000/mcp</code>
    </div>
  </aside>
</main>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
